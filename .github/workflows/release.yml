name: Release

# Push a tag like v1.0.0 (matching package.json "version") to build and publish a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub Release and upload assets

jobs:
  release:
    runs-on: macos-15 # Apple Silicon -> arm64 build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Tag must match package.json version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm e2e

      - name: Build macOS app (ad-hoc signed)
        run: pnpm dist:mac --publish never
      - name: Verify packaged app (renders PDFs, no network)
        run: pnpm verify:packaged
      - name: Check code signature
        run: codesign --verify --deep --strict "release/mac-arm64/Simple PDF.app"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.dmg release/*-mac.zip \
            --title "Simple PDF ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md \
            --generate-notes
