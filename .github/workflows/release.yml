name: Release

# Push a tag like v1.0.0 (matching package.json "version") to build and publish a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub Release and upload assets

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Tag must match package.json version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm e2e

  build:
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-15 # Apple Silicon -> arm64 build
            script: dist:mac
            artifacts: |
              release/*.dmg
              release/*-mac.zip
          - os: windows-latest
            script: dist:win
            artifacts: release/*-win-x64.exe
          - os: ubuntu-latest
            script: dist:linux
            artifacts: |
              release/*.AppImage
              release/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm ${{ matrix.script }} --publish never

      - name: Verify packaged app (renders PDFs, no network)
        if: runner.os == 'macOS'
        run: pnpm verify:packaged
      - name: Check code signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict "release/mac-arm64/Simple PDF.app"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Simple PDF ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md \
            --generate-notes
