# Minimal config so `pnpm dist:mac` is valid. T8 owns the full packaging setup.
appId: com.simplepdf.app
productName: Simple PDF
directories:
  output: release
files:
  - out/**
  - package.json
fileAssociations:
  - ext: pdf
    name: PDF Document
    mimeType: application/pdf
    role: Editor
    isPackage: false
mac:
  target: dmg
  category: public.app-category.productivity
